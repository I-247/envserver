version: 2

project_name: envclient

before:
  hooks:
    - go mod tidy

builds:
  - id: envclient
    main: ./cmd/envclient
    binary: envclient
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "envclient_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Keyless Sigstore signature over checksums.txt, as one bundle
# (certificate, signature and transparency log entry). Signing the
# checksums covers every archive they list. `envclient update` and
# install.sh verify it against this repository's release workflow and
# refuse a release without it.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
