name: release

on:
  push:
    tags:
      - 'v*'
  # Lets a maintainer re-run a publish from the tag itself: pick the tag as
  # the ref to run from in the "Run workflow" dropdown.
  workflow_dispatch:

# Nothing by default; the one job below asks for exactly what it needs.
permissions: {}

jobs:
  goreleaser:
    # A dispatch from a branch would publish that branch under the latest
    # tag, with contents: write. Only a tag ref may publish.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      # Publish the release.
      contents: write
      # Keyless signing: the OIDC token names this workflow and tag, and is
      # what `envclient update` and install.sh check the signature against.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # Follows go.mod, so CI never builds with an older Go than the
          # module (and sigstore-go) requires.
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          workdir: cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
